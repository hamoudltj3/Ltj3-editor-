
name: LTJ3 EDITOR Build and Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Download project
        uses: actions/checkout@v4

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Create Flutter Web platform
        run: flutter create --platforms=web .

      - name: Install dependencies
        run: flutter pub get

      - name: Check Dart code
        run: dart analyze lib/main.dart

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install image tools
        run: python -m pip install Pillow

      - name: Prepare LTJ3 branding
        run: |
          python - <<'PY'
          from pathlib import Path
          from PIL import Image, ImageOps

          web = Path("web")
          source = web / "apple-touch-icon.png"

          if not source.exists():
              raise FileNotFoundError(
                  "Missing web/apple-touch-icon.png"
              )

          icons = web / "icons"
          icons.mkdir(parents=True, exist_ok=True)

          with Image.open(source) as original:
              logo = original.convert("RGB")

              for size, filename in [
                  (180, "apple-touch-icon.png"),
                  (192, "icons/Icon-192.png"),
                  (512, "icons/Icon-512.png"),
                  (512, "icons/Icon-maskable-512.png"),
                  (64, "favicon.png"),
              ]:
                  output = ImageOps.fit(
                      logo,
                      (size, size),
                      method=Image.Resampling.LANCZOS,
                  )
                  output.save(web / filename, "PNG")

          print("LTJ3 branding ready")
          PY

      - name: Verify web assets
        run: |
          test -f web/index.html
          test -f web/manifest.json
          test -f web/apple-touch-icon.png
          test -f web/icons/Icon-192.png
          test -f web/icons/Icon-512.png
          echo "LTJ3 web assets verified"

      - name: Build Flutter Web
        run: |
          flutter build web --release --base-href "/Ltj3-editor-/"

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload website
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  deploy:
    needs: build
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy LTJ3 EDITOR
        id: deployment
        uses: actions/deploy-pages@v4
